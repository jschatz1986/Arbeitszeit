<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.json'><title>Arbeitszeit</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:20px 16px 80px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 14px #00000012}h1{margin:4px 0;font-size:30px}h2{font-size:18px;margin:0 0 12px}.muted{color:#6b7280}.big{font-size:38px;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;background:#f9fafb;border-radius:12px}.stat b{display:block;font-size:20px;margin-top:4px}button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#111827;color:white;margin:5px 0}.secondary{background:#e5e7eb;color:#111827}.danger{background:#991b1b}.row{display:flex;gap:8px}.row>*{flex:1}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white}.entry{border-top:1px solid #eee;padding:12px 0}.positive{color:#08783d}.negative{color:#b42318}.hidden{display:none}@media print{button,.no-print{display:none!important}.app{max-width:none}.card{box-shadow:none;border:1px solid #ddd}}
</style></head><body><div class='app'>
<h1>Arbeitszeit</h1><div class='muted' id='todayLabel'></div>
<div class='card'><div class='muted'>Status</div><div class='big' id='status'>Nicht gestartet</div><div class='grid' style='margin-top:14px'><div class='stat'>Beginn<b id='startV'>–</b></div><div class='stat'>Feierabend ca.<b id='leaveV'>–</b></div><div class='stat'>Arbeitszeit<b id='workV'>0:00</b></div><div class='stat'>Saldo<b id='balanceV'>0:00</b></div></div></div>
<div class='card'><div class='row'><button id='startBtn'>Kommen</button><button id='endBtn'>Gehen</button></div><div class='row'><button class='secondary' id='pauseBtn'>Zusatzpause starten</button><button class='secondary' id='pauseEndBtn'>Pause beenden</button></div><p class='muted'>Fixpause 12:00–12:45 wird automatisch mit 45 Minuten abgezogen. Sollzeit: 9:00 h netto, Montag–Freitag.</p></div>
<div class='card'><h2>Tag bearbeiten</h2><div class='row'><input type='date' id='editDate'><select id='dayType'><option value='work'>Arbeitstag</option><option value='vacation'>Urlaub</option><option value='sick'>Krankenstand</option><option value='holiday'>Feiertag</option><option value='free'>Frei</option></select></div><div class='row' style='margin-top:8px'><input type='time' id='editStart'><input type='time' id='editEnd'></div><label class='muted'>Zusätzliche Pause (Minuten)</label><input type='number' min='0' id='editExtra' value='0'><button class='secondary' id='saveEdit'>Speichern</button></div>
<div class='card'><h2>Monatsübersicht</h2><input class='no-print' type='month' id='monthPick'><div id='summary' class='grid' style='margin:12px 0'></div><div id='entries'></div><div class='row no-print'><button id='pdfBtn'>PDF / Drucken</button><button class='secondary' id='csvBtn'>CSV Export</button></div><button class='secondary no-print' id='backupBtn'>Backup exportieren</button><input class='no-print' type='file' id='restoreFile' accept='.json' style='margin-top:8px'></div>
</div><script>
const FIX=45,SOLL=540; const $=id=>document.getElementById(id); let data=JSON.parse(localStorage.getItem('az_data')||'{}');
const iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}, hm=d=>d?new Date(d).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}):'–';
function mins(a,b){return Math.max(0,Math.round((b-a)/60000))} function fmt(m){let s=m<0?'-':m>0?'+':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function get(k){return data[k]||(data[k]={type:'work',pauses:[]})} function save(){localStorage.setItem('az_data',JSON.stringify(data));render()}
function calc(e,live=false){if(['vacation','sick','holiday'].includes(e.type))return {work:SOLL,bal:0,extra:0}; if(e.type==='free')return {work:0,bal:0,extra:0}; if(!e.start)return {work:0,bal:-SOLL,extra:0};let end=e.end?new Date(e.end):(live?new Date():new Date(e.start));let extra=(e.extra||0)+(e.pauses||[]).reduce((n,p)=>n+(p.end?mins(new Date(p.start),new Date(p.end)):live?mins(new Date(p.start),new Date()):0),0);let work=Math.max(0,mins(new Date(e.start),end)-FIX-extra);return {work,bal:work-SOLL,extra}}
function projected(e){if(!e.start)return '–';let extra=(e.extra||0)+(e.pauses||[]).reduce((n,p)=>n+(p.end?mins(new Date(p.start),new Date(p.end)):0),0);return hm(new Date(new Date(e.start).getTime()+(SOLL+FIX+extra)*60000))}
function render(){let now=new Date(),k=iso(now),e=get(k),c=calc(e,true);$('todayLabel').textContent=now.toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});$('status').textContent=!e.start?'Nicht gestartet':e.end?'Feierabend':(e.pauses||[]).some(p=>!p.end)?'Pause':'Arbeit läuft';$('startV').textContent=hm(e.start);$('leaveV').textContent=projected(e);$('workV').textContent=fmt(c.work).replace('+','');$('balanceV').textContent=fmt(c.bal);$('balanceV').className=c.bal>=0?'positive':'negative';renderMonth()}
$('startBtn').onclick=()=>{let e=get(iso(new Date()));if(!e.start)e.start=new Date().toISOString();save()};$('endBtn').onclick=()=>{let e=get(iso(new Date()));if(e.start&&!e.end){let p=(e.pauses||[]).find(p=>!p.end);if(p)p.end=new Date().toISOString();e.end=new Date().toISOString()}save()};$('pauseBtn').onclick=()=>{let e=get(iso(new Date()));if(e.start&&!e.end&&!(e.pauses||[]).some(p=>!p.end)){e.pauses=e.pauses||[];e.pauses.push({start:new Date().toISOString()});save()}};$('pauseEndBtn').onclick=()=>{let e=get(iso(new Date()));let p=(e.pauses||[]).find(p=>!p.end);if(p){p.end=new Date().toISOString();save()}};
let today=iso(new Date());$('editDate').value=today;$('monthPick').value=today.slice(0,7);function loadEdit(){let e=get($('editDate').value);$('dayType').value=e.type||'work';$('editStart').value=e.start?new Date(e.start).toTimeString().slice(0,5):'';$('editEnd').value=e.end?new Date(e.end).toTimeString().slice(0,5):'';$('editExtra').value=e.extra||0}$('editDate').onchange=loadEdit;loadEdit();$('saveEdit').onclick=()=>{let k=$('editDate').value,e=get(k);e.type=$('dayType').value;e.extra=+$('editExtra').value||0;const mk=t=>t?new Date(k+'T'+t+':00').toISOString():null;e.start=mk($('editStart').value);e.end=mk($('editEnd').value);save()};
function renderMonth(){let m=$('monthPick').value;if(!m)return;let [y,mo]=m.split('-').map(Number),days=new Date(y,mo,0).getDate(),html='',tw=0,ts=0;for(let d=1;d<=days;d++){let k=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dt=new Date(y,mo-1,d),weekend=[0,6].includes(dt.getDay()),e=data[k],type=e?.type||(weekend?'free':'work'),x=e?calc(e):{work:0,bal:type==='work'?-SOLL:0};if(type==='work'||['vacation','sick','holiday'].includes(type))ts+=SOLL;tw+=x.work;let label={work:'Arbeit',vacation:'Urlaub',sick:'Krankenstand',holiday:'Feiertag',free:'Frei'}[type];html+=`<div class='entry'><b>${dt.toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit'})}</b> · ${label}<br><span class='muted'>${e?.start?hm(e.start):'–'} – ${e?.end?hm(e.end):'–'} · Ist ${fmt(x.work).replace('+','')} · <span class='${x.bal>=0?'positive':'negative'}'>${fmt(x.bal)}</span></span></div>`}$('entries').innerHTML=html;$('summary').innerHTML=`<div class='stat'>Soll<b>${fmt(ts).replace('+','')}</b></div><div class='stat'>Ist<b>${fmt(tw).replace('+','')}</b></div><div class='stat'>Monatssaldo<b class='${tw-ts>=0?'positive':'negative'}'>${fmt(tw-ts)}</b></div><div class='stat'>Fixpause<b>0:45/Tag</b></div>`}
$('monthPick').onchange=renderMonth;$('pdfBtn').onclick=()=>window.print();$('csvBtn').onclick=()=>{let m=$('monthPick').value,rows=['Datum;Art;Beginn;Ende;Fixpause_Min;Zusatzpause_Min;Arbeitszeit_Min;Saldo_Min'];Object.keys(data).filter(k=>k.startsWith(m)).sort().forEach(k=>{let e=data[k],c=calc(e);rows.push([k,e.type||'work',hm(e.start),hm(e.end),FIX,c.extra,c.work,c.bal].join(';'))});download('Arbeitszeit_'+m+'.csv','\ufeff'+rows.join('\n'),'text/csv;charset=utf-8')};function download(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}$('backupBtn').onclick=()=>download('Arbeitszeit_Backup.json',JSON.stringify(data,null,2),'application/json');$('restoreFile').onchange=async ev=>{try{data=JSON.parse(await ev.target.files[0].text());save()}catch{alert('Backup konnte nicht gelesen werden.')}};render();setInterval(render,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
